<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Smart Trash Box</title>
</head>
<body>
<h1>スマートゴミ箱</h1>
<button id="openBtn">開く</button>
<button id="closeBtn">閉じる</button>

<script>
let device;
let characteristic;

async function connect() {
  device = await navigator.bluetooth.requestDevice({
    filters: [{ name: 'SmartTrashBox' }],
    optionalServices: ['12345678-1234-1234-1234-1234567890ab']
  });
  
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService('12345678-1234-1234-1234-1234567890ab');
  characteristic = await service.getCharacteristic('abcd1234-5678-1234-5678-abcdef123456');
}

async function sendCommand(cmd) {
  const encoder = new TextEncoder();
  await characteristic.writeValue(encoder.encode(cmd));
}

document.getElementById('openBtn').onclick = async () => {
  if(!characteristic) await connect();
  sendCommand('OPEN');
};

document.getElementById('closeBtn').onclick = async () => {
  if(!characteristic) await connect();
  sendCommand('CLOSE');
};
</script>
</body>
</html>
