<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Smart Trash Box</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    button { font-size: 1.2em; margin: 10px; padding: 10px 20px; }
    #status { margin-top: 20px; font-size: 1.1em; }
    #connectBtn { background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #connectBtn:disabled { background: #aaa; }
  </style>
</head>
<body>
<h1>スマートゴミ箱</h1>

<!-- ✅ 明示的な接続ボタンを追加 -->
<button id="connectBtn" onclick="connect()">🔵 BLE接続</button>
<br>
<button id="openBtn" onclick="sendCommand('OPEN')">開く</button>
<button id="closeBtn" onclick="sendCommand('CLOSE')">閉じる</button>

<div id="status">
  <p>接続状態: <span id="conn">未接続</span></p>
  <p>開閉回数: <span id="count">-</span> 回</p>
</div>

<script>
let characteristic = null;
const SERVICE_UUID = '12345678-1234-1234-1234-1234567890ab';
const CHAR_UUID    = 'abcd1234-5678-1234-5678-abcdef123456';

async function connect() {
  try {
    document.getElementById('connectBtn').disabled = true;
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'SmartTrashBox' }],
      optionalServices: [SERVICE_UUID]
    });
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHAR_UUID);

    document.getElementById('conn').textContent = '接続済み ✅';
    document.getElementById('connectBtn').textContent = '接続済み';

    // ✅ 接続完了後に確実に回数を取得
    await readCount();

    device.addEventListener('gattserverdisconnected', () => {
      document.getElementById('conn').textContent = '切断 ❌';
      document.getElementById('connectBtn').disabled = false;
      document.getElementById('connectBtn').textContent = '🔵 BLE接続';
      characteristic = null;
    });
  } catch (e) {
    console.error(e);
    alert('BLE接続に失敗しました: ' + e.message);
    document.getElementById('connectBtn').disabled = false;
  }
}

async function sendCommand(cmd) {
  if (!characteristic) {
    alert('先にBLE接続してください');
    return;
  }
  try {
    const encoder = new TextEncoder();
    await characteristic.writeValue(encoder.encode(cmd));
    // ✅ 書き込み完了を待ってから回数を読む（500msに延長）
    setTimeout(readCount, 500);
  } catch (e) {
    console.error('送信エラー:', e);
  }
}

async function readCount() {
  if (!characteristic) return;
  try {
    const value = await characteristic.readValue();
    const str = new TextDecoder().decode(value);
    // ✅ NaN対策
    const count = parseInt(str);
    document.getElementById('count').textContent = isNaN(count) ? '?' : count;
  } catch (e) {
    console.error('回数読み取りエラー:', e);
  }
}
</script>
</body>
</html>
